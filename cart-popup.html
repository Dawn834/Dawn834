<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .cart-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        .cart-header {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 24px;
            text-align: center;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 12px;
            transition: all 0.2s ease;
        }

        .cart-item:hover {
            background: #f0f2f5;
            transform: translateY(-1px);
        }

        .item-image {
            width: 80px;
            height: 80px;
            background: #d0d0d0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
            flex-shrink: 0;
        }

        .item-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-name {
            background: #b8b8b8;
            color: #666;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .delete-btn {
            background: #9ca3af;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .delete-btn:hover {
            background: #6b7280;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quantity-btn {
            width: 32px;
            height: 32px;
            border: 2px solid #d1d5db;
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #374151;
            transition: all 0.2s ease;
        }

        .quantity-btn:hover {
            border-color: #9ca3af;
            background: #f9fafb;
        }

        .quantity-display {
            min-width: 40px;
            height: 32px;
            background: #e5e7eb;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #374151;
        }

        .item-price {
            font-weight: 600;
            color: #374151;
            font-size: 16px;
            margin-left: 8px;
        }

        .cart-footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 2px solid #f3f4f6;
        }

        .total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .total-label {
            font-size: 18px;
            font-weight: 600;
            color: #374151;
        }

        .total-amount {
            font-size: 20px;
            font-weight: 700;
            color: #059669;
        }

        .buy-now-btn {
            width: 100%;
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
        }

        .buy-now-btn:hover {
            background: linear-gradient(135deg, #0891b2, #0e7490);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(6, 182, 212, 0.4);
        }

        .buy-now-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .cart-container {
                margin: 10px;
                padding: 16px;
            }

            .cart-item {
                flex-direction: column;
                text-align: center;
            }

            .item-actions {
                flex-direction: column;
                gap: 8px;
                width: 100%;
            }

            .quantity-controls {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="cart-container">
        <h1 class="cart-header">Cart</h1>
        
        <div class="cart-items">
            <div class="cart-item" data-price="150000">
                <div class="item-image">Ảnh</div>
                <div class="item-details">
                    <div class="item-name">Áo thun nam</div>
                </div>
                <div class="item-actions">
                    <button class="delete-btn">Xóa</button>
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="decreaseQuantity(this)">−</button>
                        <div class="quantity-display">1</div>
                        <button class="quantity-btn" onclick="increaseQuantity(this)">+</button>
                    </div>
                    <div class="item-price">150.000₫</div>
                </div>
            </div>

            <div class="cart-item" data-price="250000">
                <div class="item-image">Ảnh</div>
                <div class="item-details">
                    <div class="item-name">Quần jeans</div>
                </div>
                <div class="item-actions">
                    <button class="delete-btn">Xóa</button>
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="decreaseQuantity(this)">−</button>
                        <div class="quantity-display">2</div>
                        <button class="quantity-btn" onclick="increaseQuantity(this)">+</button>
                    </div>
                    <div class="item-price">250.000₫</div>
                </div>
            </div>

            <div class="cart-item" data-price="120000">
                <div class="item-image">Ảnh</div>
                <div class="item-details">
                    <div class="item-name">Mũ snapback</div>
                </div>
                <div class="item-actions">
                    <button class="delete-btn">Xóa</button>
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="decreaseQuantity(this)">−</button>
                        <div class="quantity-display">1</div>
                        <button class="quantity-btn" onclick="increaseQuantity(this)">+</button>
                    </div>
                    <div class="item-price">120.000₫</div>
                </div>
            </div>

            <div class="cart-item" data-price="80000">
                <div class="item-image">Ảnh</div>
                <div class="item-details">
                    <div class="item-name">Tất nam</div>
                </div>
                <div class="item-actions">
                    <button class="delete-btn">Xóa</button>
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="decreaseQuantity(this)">−</button>
                        <div class="quantity-display">3</div>
                        <button class="quantity-btn" onclick="increaseQuantity(this)">+</button>
                    </div>
                    <div class="item-price">80.000₫</div>
                </div>
            </div>
        </div>

        <div class="cart-footer">
            <div class="total-section">
                <span class="total-label">Tổng tiền:</span>
                <span class="total-amount" id="totalAmount">1.110.000₫</span>
            </div>
            <button class="buy-now-btn">Mua ngay</button>
        </div>
    </div>

    <script>
        // Function to format currency
        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN', {
                style: 'currency',
                currency: 'VND'
            }).format(amount).replace('₫', '').trim() + '₫';
        }

        // Function to calculate total
        function calculateTotal() {
            let total = 0;
            const cartItems = document.querySelectorAll('.cart-item');
            
            cartItems.forEach(item => {
                const price = parseInt(item.dataset.price);
                const quantity = parseInt(item.querySelector('.quantity-display').textContent);
                total += price * quantity;
            });
            
            document.getElementById('totalAmount').textContent = formatCurrency(total);
        }

        function increaseQuantity(button) {
            const quantityDisplay = button.previousElementSibling;
            let currentQuantity = parseInt(quantityDisplay.textContent);
            quantityDisplay.textContent = currentQuantity + 1;
            calculateTotal();
        }

        function decreaseQuantity(button) {
            const quantityDisplay = button.nextElementSibling;
            let currentQuantity = parseInt(quantityDisplay.textContent);
            if (currentQuantity > 1) {
                quantityDisplay.textContent = currentQuantity - 1;
                calculateTotal();
            }
        }

        // Add delete functionality
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const cartItem = this.closest('.cart-item');
                cartItem.style.opacity = '0';
                cartItem.style.transform = 'translateX(-100%)';
                setTimeout(() => {
                    cartItem.remove();
                    calculateTotal();
                }, 300);
            });
        });

        // Add hover effects and animations
        document.querySelectorAll('.cart-item').forEach(item => {
            item.addEventListener('mouseenter', function() {
                this.style.boxShadow = '0 4px 12px rgba(0, 0, 0, 0.1)';
            });
            
            item.addEventListener('mouseleave', function() {
                this.style.boxShadow = 'none';
            });
        });

        // Calculate initial total when page loads
        document.addEventListener('DOMContentLoaded', function() {
            calculateTotal();
        });
    </script>
</body>
</html>
