<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Cart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .menu-bar {
      display: flex;
      justify-content: space-around;
      background-color: white;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .menu-item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 50%;
    }

    .menu-item-text {
      font-size: 12px;
      font-weight: bold;
      margin-top: 5px;
    }

    .product-row {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
    }

    .product-card {
      text-align: center;
      width: 30%;
    }

    .product-card img {
      width: 100%;
      max-width: 200px;
    }

    .product-name {
      font-weight: bold;
      margin: 10px 0;
    }

    .cart-popup {
      background-color: #FFBB00;
      padding: 20px;
      border-radius: 15px 15px 0 0;
      position: relative;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px dashed #e0e0e0;
    }

    .cart-item-details {
      display: flex;
      align-items: center;
    }

    .cart-item img {
      width: 80px;
      height: 80px;
      margin-right: 15px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
    }

    .quantity-btn {
      background-color: #e50019;
      color: white;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quantity {
      background-color: white;
      border: 1px solid #ddd;
      padding: 5px 15px;
      margin: 0 5px;
      width: 30px;
      text-align: center;
      border-radius: 5px;
    }

    .price {
      color: #e50019;
      font-weight: bold;
      font-size: 18px;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #e50019;
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
    }

    .total-text {
      font-size: 20px;
      font-weight: bold;
    }

    .total-price {
      color: #e50019;
      font-weight: bold;
      font-size: 24px;
    }

    .checkout-btn {
      background-color: #e50019;
      color: white;
      border: none;
      font-size: 18px;
      font-weight: bold;
      padding: 15px;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
    }

    .option-row {
      display: flex;
      align-items: center;
      margin: 15px 0;
    }

    .toggle {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
      margin-right: 15px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: #e50019;
    }

    input:checked+.slider:before {
      transform: translateX(22px);
    }

    .option-text {
      flex: 1;
    }

    .option-subtext {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="cart-popup">
    <h2>Giỏ hàng</h2>

    <div class="cart-item">
      <div class="cart-item-details">
        <img src="/api/placeholder/80/80" alt="2 miếng gà giòn">
        <div>2 MIẾNG GÀ GIÒN VUI VẺ</div>
      </div>
      <div class="quantity-controls">
        <button class="quantity-btn">-</button>
        <input class="quantity" type="text" value="1" readonly>
        <button class="quantity-btn">+</button>
      </div>
      <div class="price">66,000 đ</div>
      <div class="action-buttons">
        <button class="action-btn">✏️</button>
        <button class="action-btn">🗑️</button>
      </div>
    </div>

    <div class="cart-item">
      <div class="cart-item-details">
        <img src="/api/placeholder/80/80" alt="6 miếng gà giòn">
        <div>6 MIẾNG GÀ GIÒN VUI VẺ</div>
      </div>
      <div class="quantity-controls">
        <button class="quantity-btn">-</button>
        <input class="quantity" type="text" value="1" readonly>
        <button class="quantity-btn">+</button>
      </div>
      <div class="price">188,000 đ</div>
      <div class="action-buttons">
        <button class="action-btn">✏️</button>
        <button class="action-btn">🗑️</button>
      </div>
    </div>

    <div class="option-row">
      <label class="toggle">
        <input type="checkbox">
        <span class="slider"></span>
      </label>
      <div class="option-text">
        <div>Lấy dụng cụ ăn uống nhựa</div>
        <div class="option-subtext">Chúng tôi sẽ gửi dụng cụ ăn uống nhựa như: muỗng, nĩa...</div>
      </div>
    </div>

    <div class="total">
      <div class="total-text">Tổng Cộng:</div>
      <div class="total-price">254,000 đ</div>
    </div>

    <button class="checkout-btn">THANH TOÁN</button>
  </div>
</body>

</html>
