<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Admin Dashboard</title>
    <link rel="stylesheet" href="./admin-style.css">
</head>

<body>
    <div class="container">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Content Area -->
            <div class="content-area" id="tab3">
                <div class="breadcrumb">Thống kê / Danh mục</div>
                <h1 class="page-title">Danh mục</h1>

                <div class="content-header">
                    <div class="content-search">
                        <span class="search-icon">🔍</span>
                        <input type="text" placeholder="Tìm kiếm danh mục">
                    </div>

                    <div class="action-buttons">
                        <!-- <button class="btn btn-primary" id="openPopupBtn">
                            ➕ Thêm danh mục
                        </button> -->
                        <button class="btn btn-secondary">
                            <strong>X</strong> Xoá
                        </button>
                    </div>
                </div>

                <!-- Products Table -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th><input type="checkbox" class="checkbox"></th>
                                <th>Tên danh mục</th>
                                <th>Số lượng sản phẩm</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr id="product-1">
                                <td><input type="checkbox" class="checkbox"></td>
                                <td>
                                    <div class="product-cell">
                                        <span class="product-name">Đồ Việt</span>
                                    </div>
                                </td>
                                <td class="stock-count">07</td>
                                <td>
                                    <div class="action-buttons-cell">
                                        <button class="action-btn edit-btn edit-product-btn" data-id="1">✏️</button>
                                        <button class="action-btn delete-btn">🗑️</button>
                                    </div>
                                </td>

                            </tr>
                            <tr id="product-2">
                                <td><input type="checkbox" class="checkbox"></td>
                                <td>
                                    <div class="product-cell">
                                        <span class="product-name">Đồ Tây</span>
                                    </div>
                                </td>
                                <td class="stock-count">03</td>
                                <td>
                                    <div class="action-buttons-cell">
                                        <button class="action-btn edit-btn edit-product-btn" data-id="2">✏️</button>
                                        <button class="action-btn delete-btn">🗑️</button>
                                    </div>
                                </td>
                            </tr>
                            <tr id="product-3">
                                <td><input type="checkbox" class="checkbox"></td>
                                <td>
                                    <div class="product-cell">
                                        <span class="product-name">Đồ Âu</span>
                                    </div>
                                </td>
                                <td class="stock-count">02</td>
                                <td>
                                    <div class="action-buttons-cell">
                                        <button class="action-btn edit-btn edit-product-btn" data-id="3">✏️</button>
                                        <button class="action-btn delete-btn">🗑️</button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
