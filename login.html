<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Page</title>
   
</head>
<body>
    <div class="login-container">
        <!-- <div class="welcome-panel">
            <div class="diagonal-lines"></div>
            <div class="logo">
                <div class="logo-circle"></div>
                <div class="logo-text">Deo co logo</div>

            <div class="welcome-content">

                <p class="welcome-text">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Phasellus nisi risus.</p>
                <button class="view-more-btn">View more</button>
            </div>

        <div class="login-panel">
            <div class="tabs">
                <div class="tab active" onclick="showLogin()">Login</div>
                <div class="tab" onclick="showSignup()">Sign Up</div>
            </div>
            
            <div id="login-form">
                <div class="form-group">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-input" placeholder="name@mail.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" placeholder="••••••••••••••">
                </div>
                <div class="remember-forgot">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" class="checkbox">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <button class="login-btn">Login</button>
                <p class="signup-text">Not a member yet? <a href="#" onclick="showSignup(); return false;" style="color: #0066ff; text-decoration: none;">Sign up here</a></p>
            </div>
            
            <div id="signup-form">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-input" placeholder="name@mail.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" placeholder="••••••••••••••">
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-input" placeholder="••••••••••••••">
                </div>
                <div class="remember-forgot" style="margin-bottom: 20px;">
                    <div class="remember-me">
                        <input type="checkbox" id="terms" class="checkbox">
                        <label for="terms">I agree to the Terms & Conditions</label>
                    </div>
                </div>
                <button class="signup-btn">Create Account</button>
                <p class="signup-text" style="margin-top: 20px;">Already have an account? <a href="#" onclick="showLogin(); return false;" style="color: #0066ff; text-decoration: none;">Login here</a></p>
            </div>
        </div>
    </div>
    <script>
        function showLogin() {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('signup-form').style.display = 'none';
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.querySelectorAll('.tab')[1].classList.remove('active');
        }
        
        function showSignup() {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('signup-form').style.display = 'block';
            document.querySelectorAll('.tab')[0].classList.remove('active');
            document.querySelectorAll('.tab')[1].classList.add('active');
        }
    </script>
</body>
</html>
