<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar với Tabs</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            margin: 0;
            padding: 0;
        }

        .sidebar {
            width: 200px;
            background: #f1f1f1;
            padding: 20px;
        }

        .tab-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 5px;
            border: none;
            background: #ddd;
            cursor: pointer;
            text-align: left;
        }

        .tab-btn.active {
            background: #4CAF50;
            color: white;
        }

        .content {
            flex: 1;
            padding: 20px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <button class="tab-btn active" onclick="openTab('tab1')">Tab 1</button>
        <button class="tab-btn" onclick="openTab('tab2')">Tab 2</button>
        <button class="tab-btn" onclick="openTab('tab3')">Tab 3</button>
    </div>

    <div class="content">
        <div id="tab1" class="tab-content active">
            <h2>Nội dung Tab 1</h2>
            <p>Đây là nội dung của Tab 1.</p>
        </div>
        <div id="tab2" class="tab-content">
            <h2>Nội dung Tab 2</h2>
            <p>Đây là nội dung của Tab 2.</p>
        </div>
        <div id="tab3" class="tab-content">
            <h2>Nội dung Tab 3</h2>
            <p>Đây là nội dung của Tab 3.</p>
        </div>
    </div>

    <script>
        function openTab(tabId) {
            // Ẩn tất cả nội dung tab
            const tabContents = document.querySelectorAll('.tab-content');
            tabContents.forEach(tab => tab.classList.remove('active'));

            // Bỏ active tất cả các nút tab
            const tabButtons = document.querySelectorAll('.tab-btn');
            tabButtons.forEach(btn => btn.classList.remove('active'));

            // Hiển thị tab được chọn và thêm class active
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>

</html>
